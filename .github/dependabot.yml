version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    # A release is offered only after it has been out for a week: a
    # compromised version is usually pulled within hours or days
    cooldown:
      default-days: 7
    allow:
      - dependency-type: all
    groups:
      # One PR for the safe bumps, a separate PR per major
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Same week of cooldown; actions pinned to a commit get it via default-days
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

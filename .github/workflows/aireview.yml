name: aireview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: aireview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets and a read-only token: skip them. Dependabot
    # PRs come from branches of this repo, pass the fork check, but get no
    # Actions secrets either: skip them too.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.title, '[skip review]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec bin/aireview review "$PR_URL" --post
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REVIEW_AUTHOR: github-actions[bot]
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_MODE: update

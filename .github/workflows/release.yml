name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Check that the tag matches Aireview::VERSION
        run: |
          version=$(ruby -Ilib -e 'require "aireview/version"; puts Aireview::VERSION')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match lib/aireview/version.rb (${version})"
            exit 1
          fi
      - name: Extract the changelog section for this version
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            /^## / { printing = ($2 == version); next }
            printing { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No section for ${GITHUB_REF_NAME#v} in CHANGELOG.md"
            exit 1
          fi
          cat release-notes.md
      - run: bundle exec rspec
      - run: gem build aireview.gemspec
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            aireview-*.gem
            release-notes.md
          if-no-files-found: error
      # The action has no version tags, only main; pinned to a commit
      - uses: rubygems/configure-rubygems-credentials@f5a32efa94076b80b28556b2d3b04cb3707b6df1
      - run: gem push aireview-*.gem

  # Separate job so that a failure here can be re-run alone: the gem is
  # already on RubyGems.org and a second push of the same version is rejected.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: aireview-*.gem

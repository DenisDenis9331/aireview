variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 0
  AIREVIEW_IMAGE: "index.exp.railsc.ru/apress/aireview"

stages:
  - check
  - build

.check:
  stage: check
  only:
    - merge_requests
  before_script:
    - docker build --tag "aireview-ci:${CI_JOB_ID}" .
  after_script:
    - docker image rm "aireview-ci:${CI_JOB_ID}" || true

rubocop:
  extends: .check
  script:
    - docker run --rm --entrypoint bundle "aireview-ci:${CI_JOB_ID}" _2.3.26_ exec rubocop

rspec:
  extends: .check
  script:
    - docker run --rm --entrypoint bundle "aireview-ci:${CI_JOB_ID}" _2.3.26_ exec rspec

build:image:
  stage: build
  only:
    - tags
  script:
    - docker build --pull -t "${AIREVIEW_IMAGE}:${CI_COMMIT_TAG}" .
    - docker push "${AIREVIEW_IMAGE}:${CI_COMMIT_TAG}"
    - docker tag "${AIREVIEW_IMAGE}:${CI_COMMIT_TAG}" "${AIREVIEW_IMAGE}:latest"
    - docker push "${AIREVIEW_IMAGE}:latest"
